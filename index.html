const KICON={charge:'⚡',hotel:'🛏',city:'🚩',sc:''};
let map,dayLayers={},allBounds;

function init(){
  if(typeof L==='undefined')return;
  map=L.map('map',{zoomControl:false}).setView([41.6,119.3],7);
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18,attribution:'© 高德地图'}).addTo(map);
  let allPts=[];
  DATA.forEach((d,i)=>{
    const g=L.layerGroup().addTo(map);
    L.polyline(d.line,{color:d.color,weight:4.5,opacity:.9}).addTo(g);
    d.line.forEach(p=>allPts.push(p));
    d.stops.forEach((s,j)=>{
      const isSc=s.k==='sc';
      const html='<div class="kicon k-'+s.k+'" style="background:'+d.color+'">'+(isSc?(j+1):KICON[s.k])+'</div>';
      L.marker(s.p,{icon:L.divIcon({className:'',html:html,iconSize:[26,26],iconAnchor:[13,13]})}).addTo(g).bindPopup(popHtml(d,s),{maxWidth:340});
    });
    dayLayers[i]=g;
  });
  allBounds=L.latLngBounds(allPts);
  map.fitBounds(allBounds,{padding:[40,40]});
  const lg=document.getElementById('legend');
  DATA.forEach((d,i)=>{lg.innerHTML+='<label><input type="checkbox" checked onchange="togDay('+i+',this.checked)"><i style="background:'+d.color+'"></i>'+d.d+' '+d.date+'</label>';});
  lg.innerHTML+='<label><input type="checkbox" onchange="togSat(this.checked)"><i style="background:#7a5c3e"></i>卫星图</label>';
}
let _sat=null;
function togSat(on){if(!_sat)_sat=L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18});if(on){_sat.addTo(map);_sat.bringToBack();}else map.removeLayer(_sat);}
function togDay(i,on){on?dayLayers[i].addTo(map):map.removeLayer(dayLayers[i]);}
function fmtH(h){const H=Math.floor(h),M=Math.round((h-H)*60);return (H<10?'0':'')+H+':'+(M<10?'0':'')+M;}
function enc(s){return encodeURIComponent(s);}
function hBtns(it){
  return '<a class="hb hb-ct" href="'+(it.ct||('https://hotels.ctrip.com/hotels/list?keyword='+enc(it.n)))+'" target="_blank" onclick="event.stopPropagation()">携程</a>'
   +'<a class="hb hb-qn" href="https://touch.qunar.com/hotel/android/searchlist?keyword='+enc(it.n)+'" target="_blank" onclick="event.stopPropagation()">去哪儿</a>'
   +'<a class="hb hb-mt" href="https://i.meituan.com/s/'+enc(it.n)+'" target="_blank" onclick="event.stopPropagation()">美团</a>';
}
function hotelHtml(h,collapsed){
  let o='<div class="hnote">🛏 '+h.note+'</div>';
  h.list.forEach(it=>{
    o+='<div class="hrow"><span class="hname">'+it.n+'</span><span class="htag">'+it.t+'</span><div class="hdesc">'+it.d+'</div>'+hBtns(it)+'</div>';
  });
  o+='<div class="hmore">点酒店名后的按钮直达三家订房页；务必电话确认「有充电桩 + 可慢充过夜 + 车位是否紧张」。</div>';
  return o;
}
function popHtml(d,s){
  let o='<b>'+(s.k==='sc'?'🏯 ':'')+s.n+'</b><br><span class="pop-tm" style="background:'+d.color+'">'+d.d+' '+d.date+' · '+fmtH(s.h)+'</span>';
  if(s.i)o+='<div>'+s.i+'</div>';
  if(s.t)o+='<div class="pop-tip">💡 '+s.t+'</div>';
  if(s.k==='hotel'&&d.hotel){
    o+='<div style="margin-top:6px;font-weight:700;font-size:12.5px">住宿备选（点名称订房）</div>';
    d.hotel.list.forEach(it=>{o+='<div class="pop-hrow"><b>'+it.n+'</b> <span style="color:#1e8449;font-size:11.5px">'+it.t+'</span><br>'+hBtns(it)+'</div>';});
  }
  o+='<div class="pop-nav"><a href="'+navTo(s)+'" target="_blank">🚗 导航到这里</a><a href="'+navDay(d)+'" target="_blank">🧭 当天全程</a></div>';
  return o;
}
function navTo(s){return 'https://uri.amap.com/marker?position='+s.p[1]+','+s.p[0]+'&name='+encodeURIComponent(s.n)+'&callnative=1';}
function navDay(d){const ps=d.stops,f=p=>p.p[1]+','+p.p[0];let u='https://uri.amap.com/navigation?from='+f(ps[0])+'&to='+f(ps[ps.length-1])+'&name=终点';if(ps.length>2)u+='&waypoints='+ps.slice(1,-1).map(f).join('|');u+='&policy=0&callnative=1';return u;}
function buildCards(){
  const box=document.getElementById('cards');

    h+='<div class="sec">景 点 与 停 靠</div>';
    d.stops.forEach(s=>{h+='<div class="stop"><b><span class="tm">'+fmtH(s.h)+'</span>'+(s.k==='sc'?'🏯 ':(s.k==='hotel'?'🛏 ':s.k==='charge'?'⚡ ':'🚩 '))+s.n+'</b>'+(s.i?'<p>'+s.i+'</p>':'')+(s.t?'<p class="tip">💡 '+s.t+'</p>':'')+'</div>';});
    h+='<div class="hotel">'+hotelHtml(d.hotel)+'</div>';
    h+='<div class="btns"><a class="btn btn-go" href="'+navDay(d)+'" target="_blank">🚗 高德导航今天这段</a><button class="btn" onclick="event.stopPropagation();goDay('+i+')">📍 地图定位</button></div></div>';
    c.innerHTML=h;box.appendChild(c);
  });
}
function goDay(i){
  document.querySelectorAll('.card').forEach((x,j)=>x.classList.toggle('on',j===i));
  document.getElementById('c'+i).scrollIntoView({behavior:'smooth',block:'nearest'});
  const d=DATA[i];dayLayers[i].addTo(map);
  map.fitBounds(L.latLngBounds(d.line),{padding:[50,50]});
  document.getElementById('bar').textContent=d.d+' '+d.date+' · '+d.km+' km · '+d.title;
}
function showAll(){document.querySelectorAll('.card').forEach(x=>x.classList.remove('on'));DATA.forEach((d,i)=>dayLayers[i].addTo(map));map.fitBounds(allBounds,{padding:[40,40]});document.getElementById('bar').textContent='全程 6 天 · 约 2000 km · 辽五京历史环线';}
