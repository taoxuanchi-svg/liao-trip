    let sc=0;
    d.stops.forEach((s)=>{
      const isSc=s.k==='sc'; if(isSc)sc++;
      const html='<div class="kicon k-'+s.k+'" style="background:'+d.color+'">'+(isSc?(sc):(KICON[s.k]))+'</div>';
      L.marker(s.p,{icon:L.divIcon({className:'',html:html,iconSize:[26,26],iconAnchor:[13,13]})}).addTo(g).bindPopup(popHtml(d,s),{maxWidth:345});
    });
    groups.push(g);
  });
  allBounds=L.latLngBounds(allPts);
  map.fitBounds(allBounds,{padding:[40,40]});
  const lg=document.getElementById('legend');
  lg.innerHTML='<div class="lt">'+m.name+'（勾选切换）</div>';
  days.forEach((d,i)=>{lg.innerHTML+='<label><input type="checkbox" checked onchange="togDay('+i+',this.checked)"><i style="background:'+d.color+'"></i>'+d.d+' '+d.date+' '+d.title+'</label>';});
  lg.innerHTML+='<label><input type="checkbox" onchange="togSat(this.checked)"><i style="background:#7a5c3e"></i>卫星图</label>';
  buildCards(days);
  document.getElementById('bar').textContent=m.name+' · '+m.km;
}
let _sat=null;
function togSat(on){if(!_sat)_sat=L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18});if(on){_sat.addTo(map);_sat.bringToBack();}else map.removeLayer(_sat);}
function togDay(i,on){const g=groups[i];if(!g)return;on?g.addTo(map):map.removeLayer(g);}
function fmtH(h){const H=Math.floor(h),M=Math.round((h-H)*60);return (H<10?'0':'')+H+':'+(M<10?'0':'')+M;}
function enc(s){return encodeURIComponent(s);}
function hBtns(it){
  return '<a class="hb hb-ct" href="'+(it.ct||LSQ(it.n))+'" target="_blank" onclick="event.stopPropagation()">携程</a>'
   +'<a class="hb hb-qn" href="https://touch.qunar.com/hotel/android/searchlist?keyword='+enc(it.n)+'" target="_blank" onclick="event.stopPropagation()">去哪儿</a>'
   +'<a class="hb hb-mt" href="https://i.meituan.com/s/'+enc(it.n)+'" target="_blank" onclick="event.stopPropagation()">美团</a>';
}
function LSQ(s){return 'https://hotels.ctrip.com/hotels/list?keyword='+enc(s);}
function hotelHtml(h){
  let o='<div class="hnote">🛏 '+h.note+'</div>';
  h.list.forEach(it=>{o+='<div class="hrow"><span class="hname">'+it.n+'</span><span class="htag">'+it.t+'</span><div class="hdesc">'+it.d+'</div>'+hBtns(it)+'</div>';});
  o+='<div class="hmore">点按钮直达三家订房页；下单前务必电话确认「有充电桩 + 可慢充过夜 + 车位不紧张」。</div>';
  return o;
}
function popHtml(d,s){
  let o='<b>'+(s.k==='sc'?'🏯 ':'')+s.n+'</b><br><span class="pop-tm" style="background:'+d.color+'">'+d.d+' '+d.date+' · '+fmtH(s.h)+'</span>';
  if(s.i)o+='<div>'+s.i+'</div>';
  if(s.t)o+='<div class="pop-tip">💡 '+s.t+'</div>';
  if(s.k==='hotel'&&d.hotel){
    o+='<div style="margin-top:6px;font-weight:700;font-size:12.5px">住宿备选（点名称订房）</div>';
    d.hotel.list.forEach(it=>{o+='<div class="pop-hrow"><b>'+it.n+'</b> <span style="color:#1e8449;font-size:11.5px">'+it.t+'</span><br>'+hBtns(it)+'</div>';});
  }
  o+='<div class="pop-nav"><a href="'+navTo(s)+'" target="_blank">🚗 导航到这里</a><a href="'+navDay(d)+'" target="_blank">🧭 当天全程</a></div>';
  return o;
}
function navTo(s){return 'https://uri.amap.com/marker?position='+s.p[1]+','+s.p[0]+'&name='+encodeURIComponent(s.n)+'&callnative=1';}
function navDay(d){const ps=d.stops,f=p=>p.p[1]+','+p.p[0];let u='https://uri.amap.com/navigation?from='+f(ps[0])+'&to='+f(ps[ps.length-1])+'&name=终点';if(ps.length>2)u+='&waypoints='+ps.slice(1,-1).map(f).join('|');u+='&policy=0&callnative=1';return u;}
function buildCards(days){
  const box=document.getElementById('cards');box.innerHTML='';
  days.forEach((d,i)=>{
    const c=document.createElement('div');c.className='card';c.style.setProperty('--c',d.color);c.id='c'+i;
    let nsc=d.stops.filter(s=>s.k==='sc').length;
    let h='<div class="chead" onclick="goDay('+i+')"><div class="badge">'+d.d+'</div><div><div class="t1">'+d.date+' '+d.title+'</div><div class="t2">'+d.km+' km ｜ 看点'+nsc+'处</div></div><span class="arr">▼</span></div>';
    if(d.d==='D4' && cur==='planA') h+='<div class="daydistance">⚠️ 这一天按地图轨迹约444km，超过400km目标；庆陵可作为机动项，老人同行请优先保证休息与充电。</div>';
    h+='<div class="cbody">';
    if(d.fix)h+='<div class="fix">✏️ '+d.fix+'</div>';
    h+='<div class="route">🧭 '+d.route+'</div><div class="sec">当 日 逐 时</div>';
    d.tt.forEach(t=>{h+='<div class="ttrow"><span class="t">'+t[0]+'</span><span>'+t[1]+'</span></div>';});
    h+='<div class="sec">景 点 与 停 靠</div>';
    let sc=0;
    d.stops.forEach(s=>{
      const isSc=s.k==='sc'; if(isSc)sc++;
      h+='<div class="stop"><b><span class="tm">'+fmtH(s.h)+'</span>'+(isSc?'🏯 ':(s.k==='hotel'?'🛏 ':s.k==='charge'?'⚡ ':'🚩 '))+(isSc?sc+'. ':'')+s.n+'</b>'+(s.i?'<p>'+s.i+'</p>':'')+(s.t?'<p class="tip">💡 '+s.t+'</p>':'')+'</div>';
    });
    if(d.hotel)h+='<div class="hotel">'+hotelHtml(d.hotel)+'</div>';
    h+='<div class="btns"><a class="btn btn-go" href="'+navDay(d)+'" target="_blank">🚗 高德导航今天这段</a><button class="btn" onclick="event.stopPropagation();goDay('+i+')">📍 地图定位</button></div></div>';
    c.innerHTML=h;box.appendChild(c);
  });
}
function goDay(i){
  const wasOpen=document.getElementById('c'+i).classList.contains('on');
  if(wasOpen){document.getElementById('c'+i).classList.remove('on');showAll();return;}
  document.querySelectorAll('.card').forEach((x,j)=>x.classList.toggle('on',j===i));
  const el=document.getElementById('c'+i); if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});
  const d=P.plans[cur][i];
  groups.forEach((g,j)=>{if(j===i)g.addTo(map);});
  // 选中某天时只聚焦该日路线，避免偏远历史遗址让地图缩得过远。
  map.fitBounds(L.latLngBounds(d.line),{padding:[50,50]});
  document.getElementById('bar').textContent=d.d+' '+d.date+' · '+d.km+' km · '+d.title;
}
function showAll(){
  document.querySelectorAll('.card').forEach(x=>x.classList.remove('on'));
  groups.forEach(g=>g.addTo(map));
  map.fitBounds(allBounds,{padding:[40,40]});
  const m=P.meta[cur];
  document.getElementById('bar').textContent=m.name+' · '+m.km;
}
function toggleCmp(){
  const el=document.getElementById('cmp');
  if(el.style.display==='none'){
    const rows=ORDER.map(k=>{const m=P.meta[k],dd=P.plans[k];
      return '<tr><td>'+(k===cur?'● ':'')+m.name+'</td><td>'+m.km+'</td><td>'+dd.map(d=>d.km.replace(/[^\d]/g,'').slice(0,3)).join(' / ')+'</td><td>'+dd.map(d=>d.stops.filter(s=>s.k==='sc').length).reduce((a,b)=>a+b,0)+'</td></tr>';});
    el.innerHTML='<b>三方案对比</b><table><tr><th>方案</th><th>总里程</th><th>逐日里程</th><th>景点数</th></tr>'+rows.join('')+'</table><div style="margin-top:6px;font-size:11.5px;color:#7a746c">● 为当前查看方案。三个方案同为 6 天 5 晚、10/1 出 10/6 返。</div>';
    el.style.display='block';
  } else el.style.display='none';
}
init();
</script>
</body>
</html>
